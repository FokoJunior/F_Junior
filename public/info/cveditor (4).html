<title>CV Editor — Junior FOKO TADJUIGE</title>
<style>
:root {
  --e-bar: #141820;
  --e-panel: #F4F5F7;
  --e-surface: #FFFFFF;
  --e-border: #E0E3EA;
  --e-text: #0F1623;
  --e-muted: #6B7385;
  --e-accent: #2563EB;
  --e-danger: #DC2626;
  --cv-acc: #111827;
  --cv-sb: #1C1F2E;
  --cv-font: Georgia, 'Times New Roman', serif;
  --cv-ui: 'Segoe UI', system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
body { background: #2E3340; color: var(--e-text); }

/* ── APP SHELL ── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* TOPBAR */
#bar {
  height: 46px; background: var(--e-bar); display: flex; align-items: center;
  padding: 0 1rem; gap: 3px; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.brand { font-size: 0.76rem; font-weight: 700; color: #fff; letter-spacing: 0.02em;
  padding-right: 1rem; border-right: 1px solid rgba(255,255,255,0.08); margin-right: 0.4rem; white-space: nowrap; }
.tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: none; color: #7A8CA0; padding: 0.28rem 0.65rem;
  border-radius: 4px; font-size: 0.73rem; font-weight: 500; cursor: pointer;
  white-space: nowrap; transition: all 0.1s; font-family: inherit;
}
.tab:hover { background: rgba(255,255,255,0.07); color: #c8d4e0; }
.tab.on { background: rgba(255,255,255,0.1); color: #fff; }
.btn-print {
  background: #2563EB; color: #fff; border: none; padding: 0.32rem 0.9rem;
  border-radius: 4px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: background 0.1s; white-space: nowrap;
}
.btn-print:hover { background: #1d4ed8; }
.btn-sm {
  background: rgba(255,255,255,0.06); color: #9BAFBF; border: 1px solid rgba(255,255,255,0.1);
  padding: 0.28rem 0.7rem; border-radius: 4px; font-size: 0.7rem; font-weight: 500;
  cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.1s;
  display: inline-flex; align-items: center;
}
.btn-sm:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
#sv-st { font-size: 0.63rem; color: #4ade80; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }

/* BODY */
#body { display: grid; grid-template-columns: 358px 1fr; flex: 1; min-height: 0; overflow: hidden; }

/* EDITOR PANEL */
#ep { background: var(--e-panel); border-right: 1px solid var(--e-border); overflow-y: auto; padding: 1.1rem; }

/* PREVIEW PANEL */
#pp { overflow-y: auto; background: #363C48; display: flex; justify-content: center;
  align-items: flex-start; padding: 1.4rem; }
#cv { width: 794px; min-height: 1122px; background: #fff; flex-shrink: 0;
  box-shadow: 0 6px 40px rgba(0,0,0,0.32); font-family: var(--cv-font);
  font-size: 12.5px; line-height: 1.5; color: #111827; }

/* ── EDITOR CONTROLS ── */
.sh { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--e-muted); border-bottom: 1px solid var(--e-border); padding-bottom: 0.45rem; margin-bottom: 0.95rem; }
.sh2 { margin-top: 1.2rem; }
.fg { margin-bottom: 0.75rem; }
.fl { display: block; font-size: 0.62rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--e-muted); margin-bottom: 0.22rem; }
.fi, .fs, .ft {
  width: 100%; border: 1px solid var(--e-border); border-radius: 4px;
  padding: 0.4rem 0.55rem; font-size: 0.78rem; color: var(--e-text);
  background: var(--e-surface); font-family: inherit; transition: border-color 0.1s, box-shadow 0.1s;
}
.fi:focus, .fs:focus, .ft:focus { outline: none; border-color: var(--e-accent);
  box-shadow: 0 0 0 2.5px rgba(37,99,235,0.13); }
.ft { resize: vertical; min-height: 80px; line-height: 1.55; }
.fr { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.fck { display: flex; align-items: center; gap: 0.35rem; font-size: 0.76rem;
  cursor: pointer; color: var(--e-text); }
.fck input { accent-color: var(--e-accent); cursor: pointer; }

/* Cards */
.card {
  background: var(--e-surface); border: 1px solid var(--e-border); border-radius: 5px;
  padding: 0.55rem 0.65rem; margin-bottom: 0.4rem;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem;
}
.ct { font-size: 0.78rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cs { font-size: 0.68rem; color: var(--e-muted); margin-top: 0.08rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts { display: flex; gap: 0.25rem; flex-shrink: 0; }
.bi {
  border: 1px solid var(--e-border); background: var(--e-surface); color: var(--e-muted);
  border-radius: 3px; padding: 0.2rem 0.4rem; font-size: 0.68rem; cursor: pointer;
  transition: all 0.1s; font-family: inherit; line-height: 1;
}
.bi:hover { background: #EFF6FF; border-color: var(--e-accent); color: var(--e-accent); }
.bi.d:hover { background: #FEF2F2; border-color: var(--e-danger); color: var(--e-danger); }

/* Inline form */
.ef {
  background: #EFF6FF; border: 1.5px solid #BFDBFE; border-radius: 5px;
  padding: 0.85rem; margin-bottom: 0.4rem;
}
.ef-t { font-size: 0.62rem; font-weight: 700; color: var(--e-accent);
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 0.7rem; }
.fa { display: flex; gap: 0.35rem; margin-top: 0.55rem; }
.bs { background: var(--e-accent); color: #fff; border: none; padding: 0.38rem 0.8rem;
  border-radius: 4px; font-size: 0.73rem; font-weight: 600; cursor: pointer; font-family: inherit; }
.bs:hover { background: #1d4ed8; }
.bc { background: none; color: var(--e-muted); border: 1px solid var(--e-border);
  padding: 0.38rem 0.8rem; border-radius: 4px; font-size: 0.73rem; cursor: pointer; font-family: inherit; }
.bc:hover { background: var(--e-border); }
.badd {
  width: 100%; border: 1.5px dashed var(--e-border); background: none; color: var(--e-muted);
  padding: 0.5rem; border-radius: 5px; font-size: 0.73rem; cursor: pointer;
  font-family: inherit; transition: all 0.1s; margin-top: 0.2rem;
}
.badd:hover { border-color: var(--e-accent); color: var(--e-accent); background: #EFF6FF; }

/* Bullets */
.bul-list { list-style: none; display: flex; flex-direction: column; gap: 0.25rem; }
.bul-row { display: flex; gap: 0.25rem; align-items: center; }
.bul-row input { flex: 1; border: 1px solid var(--e-border); border-radius: 3px;
  padding: 0.28rem 0.4rem; font-size: 0.73rem; font-family: inherit; background: #fff; }
.bul-row input:focus { outline: none; border-color: var(--e-accent); }
.brm { background: none; border: none; color: #EF4444; cursor: pointer; font-size: 0.85rem; padding: 0 0.2rem; }

/* Tags */
.tw { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-top: 0.3rem; }
.tc {
  display: inline-flex; align-items: center; gap: 0.18rem;
  background: #EFF6FF; border: 1px solid #BFDBFE; color: #1e40af;
  font-size: 0.67rem; font-weight: 500; border-radius: 100px;
  padding: 0.1rem 0.45rem 0.1rem 0.5rem;
}
.tc.hi { background: #DBEAFE; color: #1e3a8a; font-weight: 700; }
.tc button { background: none; border: none; cursor: pointer; color: #93C5FD; font-size: 0.68rem; line-height: 1; }
.tc button:hover { color: #DC2626; }
.tar { display: flex; gap: 0.25rem; margin-top: 0.3rem; }
.tar input { flex: 1; border: 1px solid var(--e-border); border-radius: 3px;
  padding: 0.28rem 0.4rem; font-size: 0.73rem; font-family: inherit; }
.tar input:focus { outline: none; border-color: var(--e-accent); }
.bta { background: var(--e-accent); color: #fff; border: none; padding: 0.28rem 0.5rem;
  border-radius: 3px; font-size: 0.73rem; cursor: pointer; font-family: inherit; }

/* Preset pills */
.pp-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
.pp {
  display: inline-flex; align-items: center; gap: 0.28rem;
  padding: 0.27rem 0.55rem; border-radius: 100px;
  border: 1px solid var(--e-border); background: var(--e-surface);
  font-size: 0.68rem; cursor: pointer; font-family: inherit; color: var(--e-text);
  transition: border-color 0.1s;
}
.pp:hover { border-color: var(--e-accent); }
.pd { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* ── CV STYLES ── */

/* Classic */
.cvw { padding: 2.8rem 3.2rem; display: flex; flex-direction: column; gap: 1.4rem; }
.cv-hdr { border-bottom: 2px solid var(--cv-acc); padding-bottom: 0.85rem; }
.cv-name { font-size: 1.55rem; font-weight: 700; color: var(--cv-acc); letter-spacing: -0.01em; line-height: 1.1; }
.cv-sub { font-size: 0.7rem; color: #6B7280; margin-top: 0.18rem; letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--cv-ui); }
.cv-con { display: flex; flex-wrap: wrap; gap: 0.15rem 1.1rem; margin-top: 0.7rem; }
.cv-ci { font-size: 0.68rem; color: #6B7280; display: flex; align-items: center; gap: 0.28rem; font-family: var(--cv-ui); }
.cv-ci em { color: var(--cv-acc); font-style: normal; }
.cv-lbl { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--cv-acc); border-bottom: 1.5px solid var(--cv-acc); padding-bottom: 0.28rem; margin-bottom: 0.7rem; }
.cv-prof { font-size: 0.77rem; line-height: 1.7; color: #111827; }
.cv-exps { display: flex; flex-direction: column; gap: 0.85rem; }
.cv-exp { display: grid; grid-template-columns: 8px 1fr; gap: 0 0.75rem; position: relative; }
.cv-exp:not(:last-child)::after { content:''; position:absolute; left:3px; top:13px; bottom:-0.85rem; width:1.5px; background:#E5E7EB; }
.cv-dot { width:8px; height:8px; border-radius:50%; background:var(--cv-acc); margin-top:5px; position:relative; z-index:1; flex-shrink:0; }
.cv-dot.cur { background:#059669; box-shadow:0 0 0 2px #D1FAE5; }
.cv-etp { display:flex; justify-content:space-between; align-items:baseline; gap:0.4rem; }
.cv-etl { font-size:0.78rem; font-weight:700; color:#111827; font-family:var(--cv-ui); }
.cv-ed { font-size:0.62rem; color:#6B7280; white-space:nowrap; font-family:var(--cv-ui); text-align:right; }
.cv-em { font-size:0.68rem; color:#6B7280; margin-top:0.07rem; font-family:var(--cv-ui); }
.cv-ebdg { font-size:0.52rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
  padding:0.1rem 0.32rem; border-radius:100px; margin-left:0.3rem; }
.cv-bf { background:#D1FAE5; color:#065F46; }
.cv-bp { background:#F1F5F9; color:#475569; }
.cv-eul { list-style:none; margin-top:0.35rem; display:flex; flex-direction:column; gap:0.15rem; }
.cv-eul li { font-size:0.71rem; color:#111827; padding-left:0.85rem; position:relative; line-height:1.5; }
.cv-eul li::before { content:'–'; position:absolute; left:0; color:#9CA3AF; }
.cv-pg { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; }
.cv-pc { border:1px solid #E5E7EB; border-top:2.5px solid var(--cv-acc); border-radius:3px; padding:0.6rem 0.7rem; }
.cv-pn { font-size:0.74rem; font-weight:700; color:#111827; font-family:var(--cv-ui); }
.cv-pst { font-size:0.6rem; color:var(--cv-acc); font-weight:500; margin:0.08rem 0 0.22rem; font-family:var(--cv-ui); }
.cv-pd { font-size:0.65rem; color:#6B7280; line-height:1.5; }
.cv-pp { display:inline-block; font-size:0.52rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase;
  background:var(--cv-acc); color:#fff; padding:0.08rem 0.38rem; border-radius:100px; margin-top:0.3rem; }
.cv-sk { display:flex; flex-direction:column; gap:0.42rem; }
.cv-sr { display:grid; grid-template-columns:110px 1fr; gap:0.4rem; align-items:flex-start; }
.cv-sc { font-size:0.58rem; font-weight:600; color:#6B7280; text-transform:uppercase; letter-spacing:0.1em; padding-top:0.18rem; font-family:var(--cv-ui); }
.cv-stw { display:flex; flex-wrap:wrap; gap:0.17rem; }
.cv-st { font-size:0.62rem; background:#F3F4F6; border:1px solid #E5E7EB; border-radius:3px; padding:0.08rem 0.35rem; color:#374151; font-family:var(--cv-ui); }
.cv-st.hi { background:var(--cv-acc); color:#fff; border-color:var(--cv-acc); font-weight:600; }
.cv-edu { display:flex; flex-direction:column; }
.cv-er { display:flex; justify-content:space-between; align-items:flex-start; gap:0.4rem; padding:0.45rem 0; border-bottom:1px solid #F3F4F6; }
.cv-er:last-child { border-bottom:none; }
.cv-edeg { font-size:0.74rem; font-weight:700; color:#111827; font-family:var(--cv-ui); }
.cv-esc { font-size:0.65rem; color:#6B7280; margin-top:0.07rem; font-family:var(--cv-ui); }
.cv-edt { font-size:0.62rem; color:#6B7280; white-space:nowrap; font-family:var(--cv-ui); }
.cv-enc { font-size:0.56rem; font-weight:600; color:#059669; margin-left:0.25rem; }
.cv-men { font-size:0.58rem; font-weight:600; color:var(--cv-acc); margin-left:0.22rem; }
.cv-certs { display:flex; flex-direction:column; }
.cv-cr { display:flex; justify-content:space-between; align-items:center; gap:0.4rem; padding:0.35rem 0; border-bottom:1px solid #F3F4F6; }
.cv-cr:last-child { border-bottom:none; }
.cv-cn { font-size:0.72rem; font-weight:600; color:#111827; font-family:var(--cv-ui); }
.cv-co { font-size:0.63rem; color:#6B7280; font-family:var(--cv-ui); }
.cv-cdt { font-size:0.62rem; color:#6B7280; font-family:var(--cv-ui); }
.cv-cpr { font-size:0.58rem; font-weight:600; color:#D97706; }

/* Sidebar layout */
.cvsl { display:grid; grid-template-columns:210px 1fr; min-height:1122px; }
.cvs { background:var(--cv-sb); color:rgba(255,255,255,.85); padding:2rem 1.35rem; display:flex; flex-direction:column; gap:1.3rem; }

.cvs-fn { font-size:0.52rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.32); text-align:center; margin-top:0.55rem; font-family:var(--cv-ui); }
.cvs-ln { font-size:0.88rem; font-weight:800; color:#fff; text-align:center; line-height:1.15; margin-top:.1rem; font-family:var(--cv-ui); }

.cvs-lbl { font-size:.48rem; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.28); padding-bottom:.28rem; margin-bottom:.5rem; border-bottom:1px solid rgba(255,255,255,.07); font-family:var(--cv-ui); }
.cvs-ul { list-style:none; display:flex; flex-direction:column; gap:.38rem; }
.cvs-ul li { display:flex; gap:.38rem; font-size:.63rem; color:rgba(255,255,255,.52); align-items:flex-start; line-height:1.35; font-family:var(--cv-ui); }
.cvs-ci { color:rgba(255,255,255,.24); flex-shrink:0; }
.cvs-sg { margin-bottom:.6rem; }
.cvs-sgl { font-size:.52rem; font-weight:600; text-transform:uppercase; letter-spacing:.13em; color:rgba(255,255,255,.3); margin-bottom:.28rem; font-family:var(--cv-ui); }
.cvs-tw { display:flex; flex-wrap:wrap; gap:.15rem; }
.cvs-tag { font-size:.58rem; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:100px; padding:.08rem .38rem; color:rgba(255,255,255,.52); font-family:var(--cv-ui); }
.cvs-tag.hi { background:rgba(255,255,255,.13); color:rgba(255,255,255,.88); font-weight:600; }
.cvs-lr { display:flex; justify-content:space-between; font-size:.6rem; color:rgba(255,255,255,.48); font-family:var(--cv-ui); }
.cvs-lb { height:3px; background:rgba(255,255,255,.08); border-radius:100px; margin-top:.18rem; }
.cvs-lf { height:100%; background:rgba(255,255,255,.38); border-radius:100px; }
.cvs-iw { display:flex; flex-wrap:wrap; gap:.18rem; }
.cvs-it { font-size:.57rem; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:3px; padding:.1rem .32rem; color:rgba(255,255,255,.38); font-family:var(--cv-ui); }
.cvs-main { padding:2rem 2.1rem; display:flex; flex-direction:column; gap:1.3rem; }

/* PRINT */
@media print {
  *, *::before, *::after {
    print-color-adjust: exact !important;
    -webkit-print-color-adjust: exact !important;
  }
  #bar, #ep { display: none !important; }
  html, body { overflow: visible; height: auto; }
  #app { height: auto; }
  #body { grid-template-columns: 1fr; height: auto; overflow: visible; }
  #pp { padding: 0; background: white; overflow: visible; }
  #cv { box-shadow: none; width: 100%; min-height: auto; }
  @page { size: A4; margin: 0; }

  /* Sidebar : fond sombre naturel sur page 1 seulement (hauteur du contenu).
     Pages 2+ : colonne gauche vide (blanche), contenu continue à droite. */
  .cvs { z-index: 1; }
  .cvs-main { z-index: 1; }

  /* Éviter les coupures en milieu de bloc */
  .cv-exp { break-inside: avoid; page-break-inside: avoid; }
  .cv-pc  { break-inside: avoid; page-break-inside: avoid; }
  .cv-er  { break-inside: avoid; page-break-inside: avoid; }
  .cv-cr  { break-inside: avoid; page-break-inside: avoid; }
  .cvs-sg { break-inside: avoid; page-break-inside: avoid; }

  /* Garder le titre de section avec son premier enfant */
  .cv-lbl  { break-after: avoid; page-break-after: avoid; }
  .cvs-lbl { break-after: avoid; page-break-after: avoid; }

  /* Orphelins / veuves */
  p { orphans: 3; widows: 3; }

  /* ── Police : scale rem en print (le font-size du cv est contrôlé par th.size via inline style) ── */
  html { font-size: 15px; }
  #cv  { line-height: 1.55; }
}
</style>

const LS_KEY = 'cv_editor_v1';

function saveToLS() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ cv, th }));
    const el = document.getElementById('sv-st');
    if (el) {
      el.style.opacity = '1';
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.opacity = '0'; }, 2000);
    }
  } catch(e) {}
}

function loadFromLS() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.cv) {
      Object.keys(d.cv).forEach(k => { cv[k] = d.cv[k]; });
    }
    if (d.th) {
      Object.keys(d.th).forEach(k => { th[k] = d.th[k]; });
    }
  } catch(e) {}
}

function exportJSON() {
  const blob = new Blob([JSON.stringify({ cv, th }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cv-foko-junior-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON(inp) {
  if (!inp.files[0]) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.cv && !d.th) { alert('Fichier JSON non reconnu.'); return; }
      if (d.cv) Object.keys(d.cv).forEach(k => { cv[k] = d.cv[k]; });
      if (d.th) Object.keys(d.th).forEach(k => { th[k] = d.th[k]; });
      applyTheme(); renderEd(); renderCV();
    } catch(e) { alert('Fichier JSON invalide.'); }
  };
  r.readAsText(inp.files[0]);
  inp.value = '';
}

function resetData() {
  if (!confirm('Réinitialiser toutes les données ? Cette action est irréversible.')) return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}

function applyTheme() {
  const r = document.documentElement;
  r.style.setProperty('--cv-acc', th.acc);
  r.style.setProperty('--cv-sb', th.sb);
  r.style.setProperty('--cv-font', th.font==='serif' ? "Georgia,'Times New Roman',serif" : "'Segoe UI',system-ui,sans-serif");
  const el = document.getElementById('cv');
  if (el) el.style.fontSize = th.size + 'px';
  saveToLS();
}

      </select></div>
    </div>
    <div class="fg"><label class="fl">Localisation</label><input class="fi" id="ef-l" value="${esc(x.loc)}"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Début</label><input class="fi" id="ef-s" value="${esc(x.s)}" placeholder="Nov 2025"></div>
      <div class="fg"><label class="fl">Fin</label><input class="fi" id="ef-e" value="${esc(x.e)}" placeholder="Vide si en cours"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Durée</label><input class="fi" id="ef-d" value="${esc(x.dur)}" placeholder="6 mois"></div>
      <div class="fg" style="display:flex;align-items:flex-end;padding-bottom:.2rem">
        <label class="fck"><input type="checkbox" id="ef-c"${x.cur?' checked':''}> Poste actuel</label>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Missions</label>
      <ul class="bul-list" id="ef-buls">${buls}</ul>
      <button class="badd" style="margin-top:.3rem" onclick="addBulRow(${x.id})">+ Ligne</button>
    </div>
    <div class="fa">
      <button class="bs" onclick="saveExp(${x.id},${isNew})">${isNew?'Ajouter':'Enregistrer'}</button>
      <button class="bc" onclick="cancelEd()">Annuler</button>
    </div>
  </div>`;
}

function updBul(eid,i,v){const e=cv.exps.find(x=>x.id===eid);if(e){e.bul[i]=v;renderCV();}}
function rmBul(eid,i){const e=cv.exps.find(x=>x.id===eid);if(e){e.bul.splice(i,1);renderEd();renderCV();}}
function addBulRow(eid){
  if(eid===-1){const ul=document.getElementById('ef-buls');const li=document.createElement('li');li.className='bul-row';li.innerHTML='<input placeholder="Mission..."><button class="brm" onclick="this.parentElement.remove()">×</button>';ul.appendChild(li);}
  else{const e=cv.exps.find(x=>x.id===eid);if(e){e.bul.push('');renderEd();renderCV();}}
}
function getBuls(){return[...document.querySelectorAll('#ef-buls input')].map(i=>i.value).filter(v=>v.trim());}
function saveExp(id,isNew){
  const d={title:document.getElementById('ef-t').value,co:document.getElementById('ef-co').value,loc:document.getElementById('ef-l').value,type:document.getElementById('ef-ty').value,s:document.getElementById('ef-s').value,e:document.getElementById('ef-e').value,dur:document.getElementById('ef-d').value,cur:document.getElementById('ef-c').checked,bul:getBuls()};
  if(isNew){d.id=Date.now();cv.exps.unshift(d);}else{const i=cv.exps.findIndex(x=>x.id===id);if(i>=0)cv.exps[i]={...cv.exps[i],...d};}
  cancelEd();renderCV();
}

// ── Projects ──
function edProjs() {
  const cards = cv.projs.map(p => st.eid===p.id ? projForm(p,false) : `
    <div class="card">
      <div style="flex:1;min-width:0"><div class="ct">${esc(p.name)}</div><div class="cs">${esc(p.stack)}</div></div>
      <div class="acts">
        <button class="bi" onclick="startEd(${p.id})">Éditer</button>
        <button class="bi d" onclick="delItem('projs',${p.id})">Suppr.</button>
      </div>
    </div>`).join('');
  const addF = st.add && st.eid===-1 ? projForm(null,true) : `<button class="badd" onclick="startAdd(-1)">+ Ajouter un projet</button>`;
  return `<div class="sh">Projets notables</div>${cards}${addF}`;
}
function projForm(p,isNew){
  const x=p||{id:-1,name:'',stack:'',desc:'',pill:''};
  return `<div class="ef">
    <div class="ef-t">${isNew?'+ Nouveau projet':'Modifier'}</div>
    <div class="fg"><label class="fl">Nom</label><input class="fi" id="pf-n" value="${esc(x.name)}"></div>
    <div class="fg"><label class="fl">Stack</label><input class="fi" id="pf-s" value="${esc(x.stack)}"></div>
    <div class="fg"><label class="fl">Description</label><textarea class="ft" style="min-height:55px" id="pf-d">${esc(x.desc)}</textarea></div>
    <div class="fg"><label class="fl">Badge</label><input class="fi" id="pf-p" value="${esc(x.pill)}"></div>
    <div class="fa">
      <button class="bs" onclick="saveProj(${x.id},${isNew})">${isNew?'Ajouter':'Enregistrer'}</button>
      <button class="bc" onclick="cancelEd()">Annuler</button>
    </div>
  </div>`;
}
function saveProj(id,isNew){
  const d={name:document.getElementById('pf-n').value,stack:document.getElementById('pf-s').value,desc:document.getElementById('pf-d').value,pill:document.getElementById('pf-p').value};
  if(isNew){d.id=Date.now();cv.projs.push(d);}else{const i=cv.projs.findIndex(p=>p.id===id);if(i>=0)cv.projs[i]={...cv.projs[i],...d};}
  cancelEd();renderCV();
}

// ── Skills ──
function edSkills(){
  const groups=cv.skills.map(sg=>`
    <div class="card" style="flex-direction:column;align-items:stretch;gap:.4rem">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="ct">${esc(sg.cat)}</span>
        <button class="bi d" onclick="delItem('skills',${sg.id})">Suppr.</button>
      </div>
      <div class="tw">${sg.tags.map((t,i)=>`
        <span class="tc${t.hi?' hi':''}">
          ${esc(t.l)}
          <button onclick="togHi(${sg.id},${i})" title="${t.hi?'Retirer':'Mettre en avant'}">${t.hi?'★':'☆'}</button>
          <button onclick="rmTag(${sg.id},${i})">×</button>
        </span>`).join('')}
      </div>
      <div class="tar">
        <input type="text" id="nt-${sg.id}" placeholder="Nouveau tag..." onkeydown="if(event.key==='Enter')addTag(${sg.id})">
        <button class="bta" onclick="addTag(${sg.id})">+</button>
      </div>
    </div>`).join('');
  return `<div class="sh">Compétences</div>${groups}
    <div class="ef" style="margin-top:.3rem">
      <div class="ef-t">+ Nouvelle catégorie</div>
      <div class="fg"><input class="fi" id="nc" placeholder="Ex: Cloud & Infrastructure"></div>
      <button class="bs" onclick="addCat()">Ajouter</button>
    </div>`;
}
function togHi(gid,i){const g=cv.skills.find(s=>s.id===gid);if(g){g.tags[i].hi=g.tags[i].hi?0:1;renderEd();renderCV();}}
function rmTag(gid,i){const g=cv.skills.find(s=>s.id===gid);if(g){g.tags.splice(i,1);renderEd();renderCV();}}
function addTag(gid){const inp=document.getElementById('nt-'+gid);if(!inp||!inp.value.trim())return;const g=cv.skills.find(s=>s.id===gid);if(g){g.tags.push({l:inp.value.trim(),hi:0});renderEd();renderCV();}}
function addCat(){const inp=document.getElementById('nc');if(!inp||!inp.value.trim())return;cv.skills.push({id:Date.now(),cat:inp.value.trim(),tags:[]});renderEd();renderCV();}

// ── Education + Certifications ──
function edEdu(){
  const eduCards=cv.edu.map(e=>st.eid===e.id?eduForm(e,false):`
    <div class="card">
      <div style="flex:1;min-width:0"><div class="ct">${esc(e.deg)}</div><div class="cs">${esc(e.sch)}</div></div>
      <div class="acts">
        <button class="bi" onclick="startEd(${e.id})">Éditer</button>
        <button class="bi d" onclick="delItem('edu',${e.id})">Suppr.</button>
      </div>
    </div>`).join('');
  const addEdu=st.add&&st.eid===-1?eduForm(null,true):`<button class="badd" onclick="startAdd(-1)">+ Ajouter une formation</button>`;
  const certCards=cv.certs.map(c=>st.eid===('c'+c.id)?certForm(c,false):`
    <div class="card">
      <div style="flex:1;min-width:0"><div class="ct">${esc(c.name)}</div><div class="cs">${esc(c.org)}${c.date?' · '+esc(c.date):''}${c.prog?' · En cours':''}</div></div>
      <div class="acts">
        <button class="bi" onclick="startEdCert(${c.id})">Éditer</button>
        <button class="bi d" onclick="delCert(${c.id})">Suppr.</button>
      </div>
    </div>`).join('');
  const addCert=st.add&&st.eid==='cnew'?certForm(null,true):`<button class="badd" onclick="startAddCert()">+ Ajouter une certification</button>`;
  return `<div class="sh">Formations</div>${eduCards}${addEdu}
    <div class="sh sh2">Certifications</div>${certCards}${addCert}`;
}
function eduForm(e,isNew){
  const x=e||{id:-1,deg:'',sch:'',s:'',e:'',cur:false,men:''};
  return `<div class="ef">
    <div class="ef-t">${isNew?'+ Nouvelle formation':'Modifier'}</div>
    <div class="fg"><label class="fl">Diplôme</label><input class="fi" id="eu-d" value="${esc(x.deg)}"></div>
    <div class="fg"><label class="fl">École</label><input class="fi" id="eu-s" value="${esc(x.sch)}"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Début</label><input class="fi" id="eu-st" value="${esc(x.s)}"></div>
      <div class="fg"><label class="fl">Fin</label><input class="fi" id="eu-e" value="${esc(x.e)}" placeholder="Vide si en cours"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Mention</label><input class="fi" id="eu-m" value="${esc(x.men)}" placeholder="ex: Bien"></div>
      <div class="fg" style="display:flex;align-items:flex-end;padding-bottom:.2rem">
        <label class="fck"><input type="checkbox" id="eu-c"${x.cur?' checked':''}> En cours</label>
      </div>
    </div>
    <div class="fa">
      <button class="bs" onclick="saveEdu(${x.id},${isNew})">${isNew?'Ajouter':'Enregistrer'}</button>
      <button class="bc" onclick="cancelEd()">Annuler</button>
    </div>
  </div>`;
}
function saveEdu(id,isNew){
  const d={deg:document.getElementById('eu-d').value,sch:document.getElementById('eu-s').value,s:document.getElementById('eu-st').value,e:document.getElementById('eu-e').value,men:document.getElementById('eu-m').value,cur:document.getElementById('eu-c').checked};
  if(isNew){d.id=Date.now();cv.edu.push(d);}else{const i=cv.edu.findIndex(x=>x.id===id);if(i>=0)cv.edu[i]={...cv.edu[i],...d};}
  cancelEd();renderCV();
}
function certForm(c,isNew){
  const x=c||{id:-1,name:'',org:'',date:'',prog:false};
  return `<div class="ef">
    <div class="ef-t">${isNew?'+ Nouvelle certification':'Modifier'}</div>
    <div class="fg"><label class="fl">Intitulé</label><input class="fi" id="cf-n" value="${esc(x.name)}"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Organisme</label><input class="fi" id="cf-o" value="${esc(x.org)}"></div>
      <div class="fg"><label class="fl">Date</label><input class="fi" id="cf-d" value="${esc(x.date)}"></div>
    </div>
    <div class="fg"><label class="fck"><input type="checkbox" id="cf-p"${x.prog?' checked':''}> En cours</label></div>
    <div class="fa">
      <button class="bs" onclick="saveCert(${x.id},${isNew})">${isNew?'Ajouter':'Enregistrer'}</button>
      <button class="bc" onclick="cancelEd()">Annuler</button>
    </div>
  </div>`;
}
function saveCert(id,isNew){
  const d={name:document.getElementById('cf-n').value,org:document.getElementById('cf-o').value,date:document.getElementById('cf-d').value,prog:document.getElementById('cf-p').checked};
  if(isNew){d.id=Date.now();cv.certs.push(d);}else{const i=cv.certs.findIndex(c=>c.id===id);if(i>=0)cv.certs[i]={...cv.certs[i],...d};}
  cancelEd();renderCV();
}
function startEdCert(id){st={sec:'edu',eid:'c'+id,add:false};renderEd();}
function startAddCert(){st={sec:'edu',eid:'cnew',add:true};renderEd();}
function delCert(id){if(!confirm('Supprimer ?'))return;cv.certs=cv.certs.filter(c=>c.id!==id);renderEd();renderCV();}

// ── Langues & Intérêts ──
function edLangs() {
  const langCards = cv.langs.map(l => st.eid === l.id ? langForm(l, false) : `
    <div class="card">
      <div style="flex:1;min-width:0">
        <div class="ct">${esc(l.lang)}</div>
        <div class="cs">${esc(l.lv)} · ${l.pct}%</div>
        <div style="height:4px;background:var(--e-border);border-radius:100px;margin-top:.3rem">
          <div style="height:100%;width:${l.pct}%;background:var(--e-accent);border-radius:100px"></div>
        </div>
      </div>
      <div class="acts">
        <button class="bi" onclick="startEd(${l.id})">Éditer</button>
        <button class="bi d" onclick="delItem('langs',${l.id})">Suppr.</button>
      </div>
    </div>`).join('');
  const addF = st.add && st.eid === -1 ? langForm(null, true) : `<button class="badd" onclick="startAdd(-1)">+ Ajouter une langue</button>`;
  const intTags = cv.interests.map((it, i) => `
    <span class="tc">${esc(it)}<button onclick="rmInterest(${i})">×</button></span>`).join('');
  return `<div class="sh">Langues</div>${langCards}${addF}
    <div class="sh sh2">Centres d'intérêt</div>
    <div class="tw" style="margin-bottom:.5rem">${intTags}</div>
    <div class="tar">
      <input type="text" id="ni" placeholder="Ex : Musique, Cybersécurité..." onkeydown="if(event.key==='Enter')addInterest()">
      <button class="bta" onclick="addInterest()">+</button>
    </div>`;
}

function langForm(l, isNew) {
  const x = l || {id:-1, lang:'', lv:'', pct:50};
  return `<div class="ef">
    <div class="ef-t">${isNew ? '+ Nouvelle langue' : 'Modifier'}</div>
    <div class="fg"><label class="fl">Langue</label><input class="fi" id="lf-l" value="${esc(x.lang)}"></div>
    <div class="fr">
      <div class="fg"><label class="fl">Niveau</label><input class="fi" id="lf-v" value="${esc(x.lv)}" placeholder="Courant, Notions..."></div>
      <div class="fg"><label class="fl">Maîtrise (%)</label><input class="fi" type="number" min="0" max="100" id="lf-p" value="${x.pct}"></div>
    </div>
    <div class="fa">
      <button class="bs" onclick="saveLang(${x.id},${isNew})">${isNew ? 'Ajouter' : 'Enregistrer'}</button>
      <button class="bc" onclick="cancelEd()">Annuler</button>
    </div>
  </div>`;
}

function saveLang(id, isNew) {
  const d = {lang:document.getElementById('lf-l').value, lv:document.getElementById('lf-v').value, pct:parseInt(document.getElementById('lf-p').value)||0};
  if (isNew) { d.id = Date.now(); cv.langs.push(d); }
  else { const i = cv.langs.findIndex(l => l.id === id); if (i >= 0) cv.langs[i] = {...cv.langs[i], ...d}; }
  cancelEd(); renderCV();
}

function rmInterest(i) { cv.interests.splice(i, 1); renderEd(); renderCV(); }
function addInterest() {
  const inp = document.getElementById('ni');
  if (!inp || !inp.value.trim()) return;
  cv.interests.push(inp.value.trim());
  inp.value = '';
  renderEd(); renderCV();
}

// ── Theme ──
function edTheme(){
  const presets=[
    {lbl:'Noir & Blanc',a:'#111827',s:'#1C1F2E'},
    {lbl:'Bleu classique',a:'#1e40af',s:'#1e3a8a'},
    {lbl:'Vert foncé',a:'#065f46',s:'#022c22'},
    {lbl:'Bordeaux',a:'#7f1d1d',s:'#450a0a'},
    {lbl:'Violet',a:'#4c1d95',s:'#2e1065'},
    {lbl:'Slate',a:'#1e293b',s:'#0f172a'}
  ];
  return `<div class="sh">Thème & Mise en page</div>
    <div class="fg"><label class="fl">Disposition</label>
      <select class="fs" onchange="th.layout=this.value;renderCV()">
        <option value="classic"${th.layout==='classic'?' selected':''}>Classique (noir sur blanc)</option>
        <option value="sidebar"${th.layout==='sidebar'?' selected':''}>Avec sidebar sombre</option>
      </select>
    </div>
    <div class="fg"><label class="fl">Police du CV</label>
      <select class="fs" onchange="th.font=this.value;applyTheme()">
        <option value="serif"${th.font==='serif'?' selected':''}>Georgia (serif)</option>
        <option value="sans"${th.font==='sans'?' selected':''}>Système (sans-serif)</option>
      </select>
    </div>
    <div class="fg">
      <label class="fl">Taille du texte — <span id="sz-val">${th.size}px</span></label>
      <input type="range" min="10" max="17" step="0.5" value="${th.size}"
        style="width:100%;margin-top:.35rem;accent-color:var(--e-accent)"
        oninput="th.size=+this.value;applyTheme();document.getElementById('sz-val').textContent=th.size+'px'">
      <div style="display:flex;justify-content:space-between;font-size:.6rem;color:var(--e-muted);margin-top:.15rem">
        <span>Compact (10px)</span><span>Normal (12.5px)</span><span>Grand (17px)</span>
      </div>
    </div>
    <div class="fg"><label class="fl">Couleur accent</label>
      <div style="display:flex;gap:.4rem;align-items:center">
        <input type="color" value="${th.acc}" onchange="th.acc=this.value;applyTheme()" style="width:34px;height:32px;border:none;padding:0;border-radius:4px;cursor:pointer">
        <input class="fi" style="flex:1" value="${th.acc}" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)){th.acc=this.value;applyTheme()}">
      </div>
    </div>
    <div class="fg"><label class="fl">Couleur sidebar</label>
      <div style="display:flex;gap:.4rem;align-items:center">
        <input type="color" value="${th.sb}" onchange="th.sb=this.value;applyTheme()" style="width:34px;height:32px;border:none;padding:0;border-radius:4px;cursor:pointer">
        <input class="fi" style="flex:1" value="${th.sb}" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)){th.sb=this.value;applyTheme()}">
      </div>
    </div>
    <div class="fg"><label class="fl">Présets</label>
      <div class="pp-row">${presets.map(p=>`
        <button class="pp" onclick="th.acc='${p.a}';th.sb='${p.s}';applyTheme();renderEd()">
          <span class="pd" style="background:${p.a}"></span>${p.lbl}
        </button>`).join('')}
      </div>
    </div>
    <div style="margin-top:1rem;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:5px;padding:.8rem">
      <div style="font-size:.7rem;font-weight:700;color:#15803D;margin-bottom:.25rem">Impression / PDF</div>
      <p style="font-size:.68rem;color:#166534;line-height:1.55">Le bouton <strong>Imprimer · PDF</strong> masque automatiquement le panneau d'édition. Choisissez "Noir & Blanc" + désactivez les couleurs dans les options du navigateur pour un PDF pur noir/blanc.</p>
    </div>`;
}

// ── Generic helpers ──
function startEd(id){st={sec:st.sec,eid:id,add:false};renderEd();}
function startAdd(id){st={sec:st.sec,eid:id,add:true};renderEd();}
function cancelEd(){st={sec:st.sec,eid:null,add:false};renderEd();}
function delItem(col,id){
  if(!confirm('Supprimer cet élément ?'))return;
  cv[col]=cv[col].filter(i=>i.id!==id);
  renderEd();renderCV();
}

// ══════════════════════════════
// INIT
// ══════════════════════════════
loadFromLS();
initTabs();
applyTheme();
renderEd();
renderCV();
</script>
